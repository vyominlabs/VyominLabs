<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 3 Seconds me auto-redirect karega aapki Google Site par -->
    <meta http-equiv="refresh" content="3; url=https://sites.google.com/view/vyominlabs">
    <title>Vyomin Labs | Redirecting...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #060911;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Cyan Glow in Background */
        .glow-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.28) 0%, rgba(0, 114, 255, 0.12) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: pulseGlow 4s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-15px, -15px); opacity: 0.7; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 1; }
        }

        /* High-Tech Glassmorphism Card */
        .redirect-card {
            position: relative;
            z-index: 2;
            background: rgba(10, 17, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.28);
            border-radius: 26px;
            padding: 44px 36px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 210, 255, 0.22);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animated Spinner Rings around Logo */
        .spinner-wrapper {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto 24px auto;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .ring-1 {
            border-top-color: #00d2ff;
            border-right-color: #00d2ff;
            animation: spin 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            filter: drop-shadow(0 0 10px #00d2ff);
        }

        .ring-2 {
            border-bottom-color: rgba(0, 210, 255, 0.35);
            border-left-color: rgba(0, 210, 255, 0.35);
            animation: spinReverse 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        /* Center Icon Box with Cyan Logo */
        .spinner-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62px;
            height: 62px;
            background: rgba(8, 14, 26, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(0, 210, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            padding: 10px;
        }

        .spinner-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.8));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Brand Title */
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-title .brand-accent {
            color: #00d2ff;
            text-shadow: 0 0 16px rgba(0, 210, 255, 0.65);
        }

        .tagline {
            font-size: 13px;
            color: #8fa5c2;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        /* Cyan Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0072ff, #00d2ff);
            box-shadow: 0 0 12px #00d2ff;
            border-radius: 8px;
            animation: fillProgress 3s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Redirect Button */
        .redirect-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.35);
            color: #e0f7ff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            width: 100%;
        }

        .redirect-btn:hover {
            background: rgba(0, 210, 255, 0.22);
            border-color: #00d2ff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            transform: translateY(-1px);
        }

        .redirect-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #00d2ff;
            stroke-width: 2.5;
            transition: transform 0.2s;
        }

        .redirect-btn:hover svg {
            transform: translateX(3px);
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>

    <div class="redirect-card">
        <div class="spinner-wrapper">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="spinner-icon">
                <!-- Aapka Original Vector Logo in Cyan (#00D2FF) -->
                <svg viewBox="0 0 1000 1000" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#00D2FF" d="M-0,338.8c0,-187.1141 151.6859,-338.8 338.8,-338.8l408.608,-0l-406.3255,407.3971l-0,-243.9358l-0.001,-0c-97.3766,0 -176.316,78.9394 -176.316,176.316l0,427.9817l602.7082,-604.2977l-128.0452,-0c-4.0422,-0 -7.6869,-2.4336 -9.2363,-6.1671c-1.5494,-3.7335 -0.6986,-8.0326 2.1559,-10.8947c41.777,-41.8872 146.0144,-146.3995 146.0144,-146.3995l221.6375,0l0,221.1176c0,-0 -104.6303,104.9063 -146.5641,146.9507c-2.8579,2.8654 -7.1611,3.7258 -10.9011,2.1796c-3.74,-1.5463 -6.1793,-5.1943 -6.1793,-9.2413c0,-42.6777 0,-126.8844 0,-126.8844l-602.0833,603.6712l424.6993,-0c97.9665,0 177.384,-79.4175 177.384,-177.384l0,-0.0005l-243.5367,-0l407.1812,-408.2551l-0,409.0462c0,187.1141 -151.6859,338.8 -338.8,338.8l-661.2,0l-0,-661.2Z"/>
                </svg>
            </div>
        </div>

        <h1 class="brand-title">Vyomin <span class="brand-accent">Labs</span></h1>
        <p class="tagline">Exploring Beyond Horizons...</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <a href="https://sites.google.com/view/vyominlabs" class="redirect-btn">
            Continue to Official Site
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = "https://sites.google.com/view/vyominlabs";
        }, 3000);
    </script>
</body>
</html>
